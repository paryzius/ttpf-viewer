[package]
name = "ttpf-viewer"
version = "0.6.0"
edition = "2024"
rust-version = "1.95"
description = "Browse and extract textures from .ttpf texture archives"
license = "GPL-3.0-only"

[dependencies]
victory-bcpack = { path = "vendor/victory-bcpack" }
sixng-core = { git = "https://github.com/holdmysocks/SixNG", rev = "102a534a1842394e74f11f0e3e605b6b824f93a1", default-features = false }
arboard = "3"
eframe = "0.37.0"
flate2 = "1.1.11"
image = { version = "0.25.10", default-features = false, features = ["png"] }
memmap2 = "0.9.12"
rayon = "1.12.0"
rfd = "0.18.0"
texture2ddecoder = "0.1.2"

[dev-dependencies]
bcpack-rs = { git = "https://github.com/Ahmet-Dedeler/bcpack-rs", rev = "7b2b42122c6b05787506f212e9a2570999d3f143", default-features = false }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 2          # decoding is far too slow unoptimised
