[package]
name = "ttpf-viewer"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "Browse and extract textures from .ttpf texture archives"
license = "MIT"

[dependencies]
arboard = "3"
eframe = "0.37.0"
flate2 = "1.1.11"
image = { version = "0.25.10", default-features = false, features = ["png"] }
memmap2 = "0.9.12"
rayon = "1.12.0"
rfd = "0.18.0"
texture2ddecoder = "0.1.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 2          # decoding is far too slow unoptimised
